name: Build bilingual research papers

on:
  push:
    branches: [main]
    paths:
      - 'paper/lean-formalization/main_zh.tex'
      - 'paper/lean-formalization/main_en.tex'
      - '.github/workflows/build-bilingual-papers.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Import verified formalization']
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  build-papers:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install TeX and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk

      - name: Compile Chinese and English papers
        working-directory: paper/lean-formalization
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main_zh.tex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main_en.tex
          pdfinfo main_zh.pdf | head -15
          pdfinfo main_en.pdf | head -15

      - name: Publish compiled PDFs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/lean-formalization/main_zh.pdf paper/lean-formalization/main_en.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build updated Chinese and English papers"
            git push
          fi

      - name: Upload downloadable paper files
        uses: actions/upload-artifact@v4
        with:
          name: carlet-bilingual-papers
          path: |
            paper/lean-formalization/main_zh.pdf
            paper/lean-formalization/main_en.pdf
          if-no-files-found: error
          retention-days: 30
